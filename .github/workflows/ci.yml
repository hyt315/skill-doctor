name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self static audit
        run: python scripts/audit.py .
      - name: Regression tests (includes selftest and trigger evaluation)
        run: python -B -m unittest discover -s tests -v
